name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS Trixie's Python (what new cards get, and what the frame runs)
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Tools for video, sync and HEIC tests. Ubuntu's package servers are often
      # slow (anything from 25 s to 13 minutes), so the packages are kept in
      # GitHub's cache and installed from there. The copy is remade when the
      # list below or GitHub's machine image changes, or after a week unused.
      - name: Which packages, for which machine
        id: apt
        run: |
          echo "pkgs=ffmpeg mpv libheif-examples libheif-plugin-x265 libheif-plugin-libde265 fonts-dejavu-core" >> "$GITHUB_OUTPUT"
          echo "key=apt-${ImageOS}-${ImageVersion}-$(echo 'v1 ffmpeg mpv libheif-examples libheif-plugin-x265 libheif-plugin-libde265 fonts-dejavu-core' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Packages from the cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}

      - name: Install tools (video, sync, HEIC)
        env:
          PKGS: ${{ steps.apt.outputs.pkgs }}
          CACHED: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          mkdir -p ~/apt-debs/partial
          if [ "$CACHED" = true ] && sudo dpkg -i ~/apt-debs/*.deb >/tmp/dpkg.log 2>&1; then
            echo "Installed $(ls ~/apt-debs/*.deb | wc -l) packages from the cache"
            exit 0
          fi
          [ "$CACHED" = true ] && { echo "The cached packages didn't install; downloading instead"; tail -5 /tmp/dpkg.log; }
          # Ubuntu's servers sometimes answer 503, or 404 while an update is
          # being published: refresh the package list and try again.
          for attempt in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=5 &&
            sudo apt-get install -y -q -o Acquire::Retries=5 -o Dir::Cache::Archives="$HOME/apt-debs" \
              --no-install-recommends $PKGS &&
            { sudo chown -R "$(id -u)" ~/apt-debs; echo "fresh=1" >> "$GITHUB_ENV"; exit 0; }
            echo "Package download failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done
          exit 1

      - name: Keep the packages for next time
        if: env.fresh == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}

      - name: Install rclone (current, as the frame's installer does; Ubuntu's is too old)
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 755 /tmp/rclone/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt qrcode gpiozero pytest pytest-xdist

      - name: Run the tests
        # on all cores; each file's tests stay together (some share a port)
        run: python -m pytest tests -q -ra -n auto --dist loadfile

  package:
    name: Build the update package and kit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash kit/build-kit.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: pi-frame-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
