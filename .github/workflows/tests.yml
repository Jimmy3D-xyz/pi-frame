name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS Trixie's Python (what new cards get, and what the frame runs)
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Tools for video, sync and HEIC tests. Ubuntu's package servers are often
      # slow (77 MB has taken anything from seconds to 13 minutes), so the
      # downloaded packages are kept in GitHub's cache. apt still reads the
      # current package list (quick), then installs from the kept copies and
      # downloads only what has changed since; a new copy is kept when it did.
      - name: Which packages
        id: apt
        run: |
          pkgs="ffmpeg mpv libheif-examples libheif-plugin-x265 libheif-plugin-libde265 fonts-dejavu-core"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-${ImageOS}-$(echo "v2 $pkgs" | sha256sum | cut -c1-12)-" >> "$GITHUB_OUTPUT"

      - name: Packages from the cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.prefix }}none
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install tools (video, sync, HEIC)
        id: install
        env:
          PKGS: ${{ steps.apt.outputs.pkgs }}
        run: |
          mkdir -p ~/apt-debs/partial
          echo "$(ls ~/apt-debs/*.deb 2>/dev/null | wc -l) packages in the cache"
          sudo rm -f /var/lib/man-db/auto-update   # skip rebuilding the manual pages' index
          # Ubuntu's servers sometimes answer 503, or 404 while an update is
          # being published: refresh the package list and try again.
          ok=0
          for attempt in 1 2 3; do
            if sudo apt-get update -q -o Acquire::Retries=5 &&
               sudo apt-get install -y -q -o Acquire::Retries=5 -o Dir::Cache::Archives="$HOME/apt-debs" \
                 --no-install-recommends $PKGS; then ok=1; break; fi
            echo "Package download failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done
          [ "$ok" = 1 ] || exit 1
          sudo chown -R "$(id -u)" ~/apt-debs
          # keep only the versions now installed, and name the copy after them
          for f in ~/apt-debs/*.deb; do
            [ -e "$f" ] || continue
            p=$(dpkg-deb -f "$f" Package); v=$(dpkg-deb -f "$f" Version)
            [ "$(dpkg-query -W -f '${Version}' "$p" 2>/dev/null)" = "$v" ] || rm -f "$f"
          done
          echo "key=${{ steps.apt.outputs.prefix }}$(ls ~/apt-debs/*.deb 2>/dev/null | xargs -n1 basename | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Keep the packages for next time
        if: steps.install.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.install.outputs.key }}

      - name: Install rclone (current, as the frame's installer does; Ubuntu's is too old)
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 755 /tmp/rclone/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt qrcode gpiozero pytest pytest-xdist

      - name: Run the tests
        # on all cores; each file's tests stay together (some share a port)
        run: python -m pytest tests -q -ra -n auto --dist loadfile

  package:
    name: Build the update package and kit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash kit/build-kit.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: pi-frame-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
