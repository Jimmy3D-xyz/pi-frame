name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS Trixie's Python (what new cards get, and what the frame runs)
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install tools (video, sync, HEIC)
        run: |
          # Ubuntu's servers sometimes answer 503, or 404 while an update is
          # being published: refresh the package list and try again.
          for attempt in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=5 &&
            sudo apt-get install -y -q -o Acquire::Retries=5 --no-install-recommends \
              ffmpeg mpv libheif-examples libheif-plugin-x265 libheif-plugin-libde265 fonts-dejavu-core &&
            exit 0
            echo "Package download failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done
          exit 1

      - name: Install rclone (current, as the frame's installer does; Ubuntu's is too old)
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 755 /tmp/rclone/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt qrcode gpiozero pytest

      - name: Run the tests
        run: python -m pytest tests -q -ra

  package:
    name: Build the update package and kit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash kit/build-kit.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: pi-frame-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
