name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11: Raspberry Pi OS Bookworm. 3.13: Raspberry Pi OS Trixie.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install tools (video, sync, HEIC)
        run: |
          sudo apt-get update -q -o Acquire::Retries=5
          sudo apt-get install -y -q -o Acquire::Retries=5 --no-install-recommends ffmpeg mpv libheif-examples libheif-plugin-x265 libheif-plugin-libde265 fonts-dejavu-core

      - name: Install rclone (current, as the frame's installer does; Ubuntu's is too old)
        run: |
          curl -fsSL -o /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 755 /tmp/rclone/rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt qrcode gpiozero pytest

      - name: Run the tests
        run: python -m pytest tests -q -ra

  package:
    name: Build the update package and kit
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash kit/build-kit.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: pi-frame-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30
