name: Release

# Every version (tags like v0.30.0): a release with the update package and the
# installer kit, in a minute or two. No new image: the notes point to the
# newest release that has one, and a frame set up from it updates itself from
# there. image.yml builds an image when one is needed (by hand).
on:
  push:
    tags: ["v*"]
  # or from the Actions tab: releases the version in the code (v + version)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the update package and kit
        run: bash kit/build-kit.sh dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' photoframe/__init__.py)
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="v$ver"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::v$ver is already released. Raise the version in photoframe/__init__.py first."; exit 1
            fi
          fi
          # the newest full release with a ready-made image
          img=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
                -q '[.[] | select(.prerelease | not) | select(any(.assets[]; .name | endswith(".img.xz")))][0].tag_name // empty' \
                || true)
          # a test version (0.37.0-beta.1) is published as a pre-release: only frames on
          # the Test channel take it, and "latest" (frames on Stable, the installer) skips it
          flags=""; title="Pi Frame $ver"
          case "$ver" in
            *-beta*) flags="--prerelease"; title="Pi Frame $ver (test)" ;;
          esac
          {
            if [ -n "$flags" ]; then
              echo "**Test release.** Only frames set to the **Test** channel (Maintenance → Software update) install it by themselves."
              echo
            fi
            echo "**Update**: upload \`pi-photoframe.zip\` on the frame's Maintenance tab → Software update."
            echo
            echo "- New frame on a card you've written yourself? Over SSH: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash\`"
            echo "- \`pi-frame-kit.zip\`: the installer kit, to copy onto the card by hand instead"
            if [ -n "$img" ]; then
              echo "- New frame? Use the ready-made image from [$img](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$img); it updates itself to this version (or update from the Maintenance tab)."
            fi
            echo
            echo "Built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d)."
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" $flags \
            --notes-file notes.md dist/pi-photoframe.zip dist/pi-frame-kit.zip dist/pi-frame-kit.zip.sha256 dist/install.sh
