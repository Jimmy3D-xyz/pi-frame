name: Image

# The ready-made Pi Frame image (Raspberry Pi OS Lite + Pi Frame, booting into
# first-run setup). Built by hand from the Actions tab when one is needed:
# after a change to the first start, a new Raspberry Pi OS, or now and then
# so new frames start closer to the latest version. Versions are normally
# released without an image, by release.yml.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish it as a test build (pi-frame-test)"
        type: boolean
        default: true
      release:
        description: "Add it to this version's release (v + the version in the code; released now if it isn't out yet)"
        type: boolean
        default: false
      intel:
        description: "Build on an Intel machine, with Arm emulation (slower; Arm is the default)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  image:
    # Arm, like the Pi: everything runs natively (about 6 minutes, against 15
    # with emulation on Intel)
    runs-on: ${{ inputs.intel && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Install tools (Arm emulation, image tools)
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=5 &&
            sudo apt-get install -y -q -o Acquire::Retries=5 --no-install-recommends \
              $( [ "$(uname -m)" = aarch64 ] || echo qemu-user-static binfmt-support ) xz-utils fdisk e2fsprogs zerofree zip &&
            break
            sleep 30
          done
          if [ "$(uname -m)" != aarch64 ]; then  # an Intel machine: run Arm programs through the emulator
            sudo update-binfmts --enable qemu-aarch64 || true
            ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
          fi
          echo "Building on $(uname -m), $(nproc) cores"

      - name: Build the image
        run: |
          sudo bash deploy/build-image.sh dist
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Build the update package and kit
        run: bash kit/build-kit.sh dist

      - name: Publish
        if: github.event_name == 'push' || inputs.publish || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' photoframe/__init__.py)
          if [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF_NAME}"; title="Pi Frame $ver"; flags=""
          elif [ "${{ inputs.release }}" = true ]; then
            tag="v$ver"; title="Pi Frame $ver"; flags=""
            if gh release view "$tag" >/dev/null 2>&1; then
              # already released (by release.yml): add the image to it
              gh release upload "$tag" dist/pi-frame-*.img.xz dist/pi-frame-*.img.xz.sha256 --clobber
              gh release view "$tag" --json body -q .body > old.md
              { echo "**Ready-made image** (added $(date -u +%Y-%m-%d)): write \`pi-frame-$ver.img.xz\` to a microSD card"
                echo "with Raspberry Pi Imager (Operating system → Use custom). See [Installing](https://github.com/JimmySte/pi-frame/blob/main/docs/installing.md)."
                echo; grep -v '^- New frame?' old.md; } > notes.md
              gh release edit "$tag" --notes-file notes.md
              exit 0
            fi
          else
            tag="pi-frame-test"; title="Pi Frame $ver (test build)"; flags="--prerelease"
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
          cat > notes.md <<EOF
          **Ready-made image**: write \`pi-frame-$ver.img.xz\` to a microSD card with Raspberry Pi Imager
          (Operating system → Use custom), put it in a Raspberry Pi 4, and switch it on with the monitor connected.
          The frame starts a Wi-Fi hotspot and shows a QR code; scan it and the welcome wizard does the rest.
          See [Installing](https://github.com/JimmySte/pi-frame/blob/main/docs/installing.md).

          - \`pi-photoframe.zip\`: the update package (Maintenance → Software update)
          - \`pi-frame-kit.zip\`: the installer kit, for setting up a card you've written yourself

          Built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d).
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md $flags \
            dist/pi-frame-*.img.xz dist/pi-frame-*.img.xz.sha256 dist/pi-photoframe.zip dist/pi-frame-kit.zip
