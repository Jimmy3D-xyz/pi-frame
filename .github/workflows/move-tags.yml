# One-off: move every tag to its commit in the rewritten history (.github/tag-map.txt).
# Run once from Actions → "Move tags to the rewritten history"; then it's deleted.
name: Move tags to the rewritten history

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would move"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move the tags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/move-tags.sh
