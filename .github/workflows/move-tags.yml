# One-off: after the history was rewritten (0.36.0, to take a personal email
# address out of the first commit), move every tag from the old commits to
# their rewritten twins on main. A twin has the same files (tree), the same
# message and the same date, so nothing a release points to changes.
# Run it once from Actions → "Move tags to the rewritten history"; it can be
# deleted afterwards. Tags moved with the workflow's own token don't start
# the Release workflow.
name: Move tags to the rewritten history

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would move"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move the tags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/move-tags.sh
