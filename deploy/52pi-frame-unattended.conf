// Pi Frame: install only Debian's security updates, each night at 03:40
// (pi-frame-security.timer runs unattended-upgrade; apt's own daily run is
// switched off so the timing stays in one place). Feature updates, and the
// kernel and firmware from Raspberry Pi's archive, are left alone.
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
        "origin=Debian,codename=${distro_codename},label=Debian-Security";
};
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "false";
Unattended-Upgrade::OnlyOnACPower "false";
Dpkg::Options {
        "--force-confdef";
        "--force-confold";
};
APT::Periodic::Unattended-Upgrade "0";
